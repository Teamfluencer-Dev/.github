name: Claude PR Review (reusable, disabled)

# The API-billed CI review is switched off (September 2026). Reviews now run on
# each developer's Claude Code subscription via the tf-review plugin
# (`/pr-review`), and every default branch requires the `claude-review` commit
# status that the plugin sets. See README.md.
#
# This stub stays so existing `pr-review.yml` callers keep resolving: the job is
# always skipped, uses no runner minutes and no API key. Remove the callers at
# leisure, then delete this file.

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: false
      max_turns:
        type: number
        required: false
      incremental_max_turns:
        type: number
        required: false
      incremental_max_lines:
        type: number
        required: false

permissions:
  contents: read

jobs:
  review:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "API review disabled — run /pr-review in Claude Code"
