name: Claude PR Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Claude model id (override per-repo if needed)
        default: claude-opus-4-8
        type: string
      max_turns:
        description: Max agent turns (cost cap)
        default: 45
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip noisy / unsafe / opted-out cases
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine the base ref dynamically (master/main) so the diff command works
      # across all four caller repos (master for the big-4, main for any future addition).
      - name: Resolve base ref
        id: base
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          echo "ref=$BASE" >> $GITHUB_OUTPUT

      # v10 #2 — Static review hints (deterministic grep over the PR diff).
      # Front-loads suspect patterns into the prompt so Claude does not waste
      # the first turns anchoring on the first file it opens. CANDIDATES not
      # findings — Claude must dismiss-with-reason or promote each row.
      - name: Static review hints
        id: hints
        run: |
          BASE_REF="origin/${{ steps.base.outputs.ref }}"
          # Bring base ref into local refs (fetch-depth: 0 above guarantees history is here)
          git fetch origin "${{ steps.base.outputs.ref }}" --depth=1 || true
          run_grep() {
            local label="$1"; shift
            local pattern="$1"; shift
            echo ""
            echo "### $label"
            git diff "$BASE_REF...HEAD" -- '*.ts' '*.tsx' '*.js' 2>/dev/null \
              | grep -nE "^\+" \
              | grep -nE "$pattern" \
              | head -25 \
              || echo "  (no matches)"
          }
          {
            echo "## Suspect candidate table (regex-based — CANDIDATES, not findings)"
            echo "These are deterministic grep hits over the diff. For each row Claude must"
            echo "either dismiss with reason or promote to a finding under the relevant lens."
            run_grep "Unguarded LLM/enum casts (Step 5.5c)" 'as (TierName|Gender|Status|Category|Tier|Role)\[\]|as \"[a-z_]+\"'
            run_grep "Hardcoded snapshot defaults to an LLM (Step 5.5b)" '(followerMin|followerMax|verifiedOnly|includeCelebrity|cost_usd):\s*(0|false|true|999_?999)'
            run_grep "Retrieval call sites (Step 5.5a — pair with brief sites below)" 'pineconeCandidatePool|vectorSearch|embedQuery|getEmbedding'
            run_grep "Brief / scorer call sites (Step 5.5a — pair with retrieval sites above)" 'brief\s*=|llmScorer|scorerBrief|messages\.create|chat\.completions'
            run_grep "Unbounded array growth (Step 5 abuse)" '\.push\(|\$push'
            run_grep "Cache read sites (Step 5.5d — verify invalidation)" 'cache\.(get|wrap)|memoize|findCached'
          } > /tmp/hints.md
          {
            echo 'hints<<HINTS_EOF'
            cat /tmp/hints.md
            echo 'HINTS_EOF'
          } >> "$GITHUB_OUTPUT"

      # v10 #3 — Load repo-specific conventions (named invariants INV-###).
      # Empty fallback if the file does not exist — does not break the workflow.
      - name: Load repo conventions
        id: conv
        run: |
          FILE=.github/claude-review-context.md
          if [ -f "$FILE" ]; then
            CONV="$(cat "$FILE")"
          else
            CONV="(no repo-specific conventions file found at .github/claude-review-context.md)"
          fi
          {
            echo 'conv<<CONV_EOF'
            echo "$CONV"
            echo 'CONV_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude senior-dev review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Auto-post / update a single sticky comment per PR with Claude's findings.
          # Without this the action runs Claude silently and posts nothing.
          use_sticky_comment: "true"
          track_progress: "true"
          prompt: |
            You are a senior software engineer reviewing a pull request. Be
            thorough but disciplined. Optimize for catching real problems
            across the breadth of the diff, not just the first cluster.

            # Inputs front-loaded for you

            ## Repo-specific enforceable invariants (cite by INV-### when relevant)
            The reviewing team has codified canonical guards and patterns for this
            repo. When the diff touches a pattern named below, you MUST verify the
            guard is present or flag the violation. If a peer file already implements
            the guard, name it (file:line) in your finding.

            ${{ steps.conv.outputs.conv }}

            ## Static review hints (CANDIDATES — dismiss with reason or promote)
            The following table is deterministic grep over the PR diff. Treat each
            row as a CANDIDATE for the relevant lens, not as a confirmed finding.
            Read these BEFORE opening files — they are the suggested starting
            point for your file inventory in Step 0.

            ${{ steps.hints.outputs.hints }}

            # Process — sectional senior-dev review

            You have ~45 tool calls and ~15 file reads of budget. Use them.
            Anchoring on the first big bug you find is the #1 failure mode of
            this review — every section below is mandatory before you post.

            ## Step 0 — Scope
            Read PR title + description + `git diff --stat ${{ steps.base.outputs.ref }}...HEAD` (Bash).
            List every changed file. Cross-reference against the static-hint
            candidate table above — that table is your prioritized starting
            inventory. You will check coverage against this list at the end.

            ## Step 1 — Data-flow trace (REQUIRED)
            Pick 2-3 of the most important user-controlled or cross-module
            inputs (IDs, query strings, brief text, filter snapshots). Trace
            each one from producer → consumer through the new modules. Flag:
            - Type / shape mismatches (e.g. string vs ObjectId, Mongoose
              aggregate not auto-casting like find/findOne does).
            - Enum / vocabulary drift between producing and consuming models
              (e.g. campaign gender enum vs user gender enum).
            - Encoding / locale mismatches (case-sensitivity, normalization).
            - Whether the "rich" version of a signal (brief) reaches every
              consumer or whether the "thin" version (bare query) leaks
              through and silently degrades behavior.

            ## Step 2 — Contract drift (REQUIRED)
            For each new function with a JSDoc / leading comment, read the
            implementation and check the promise holds. Common drifts:
            - "Falls back to neutral on timeout / error" comment with no
              try/catch around the network call.
            - "Prompt caching enabled" claims when the cached prefix is below
              the model's minimum cacheable size.
            - "Returns immediately, client polls" claims that actually `await`
              the full pipeline inside the HTTP handler.

            ## Step 3 — Sibling-route consistency (REQUIRED if HTTP routes added)
            For each new route, find peer routes in the same router (Bash:
            `grep -n "router\\." path/to/router.ts`). Diff their middleware
            stacks: auth, subscription gate, rate limit, body validation,
            CORS. If a new paid / LLM-cost route skips middleware that peers
            use, that is a finding.

            ## Step 4 — State machine integrity (REQUIRED if new model has status field)
            For any new model with `status: pending|running|completed|failed`
            (or similar), check:
            - Transitions: who writes each state, are there guards?
            - Idempotency locks: if a `running` row blocks a re-trigger, what
              recovers a crashed `running` (process restart, mongo blip)?
              Is there a stale-running sweep or just the TTL?
            - Recovery: can a crashed run silently hold a per-(brand,resource)
              lock for hours?

            ## Step 5 — Abuse & injection vectors (REQUIRED)
            - Is any user-controlled string interpolated verbatim into an LLM
              message (system / user / tool input)? Prompt injection vector.
            - Any unbounded request field persisted into a Mongo doc (16MB
              hard limit; DoS / cost amplification)?
            - Any unguarded enum cast like `x as TierName[]` where the source
              is an LLM-emitted string? Hallucinated value → TypeError 500.
            - Any AuthN/AuthZ gap, e.g. a paid LLM route on a free tier?

            ## Step 5.5 — LLM-codepath specifics (REQUIRED if diff touches prompts, tool definitions, embeddings, or Anthropic/OpenAI SDK calls; skip otherwise)
            These four checks address the failure modes of LLM-glue code that
            generic senior-dev lenses miss. Each is a BLOCKER class when present.

            **(a) Retrieval ↔ scoring signal parity** — Does the signal embedded
            for vector / semantic retrieval match the signal the downstream LLM
            scorer/reasoner actually sees? Concretely: if retrieval calls
            `pineconeCandidatePool(req.query, ...)` while the LLM scorer receives
            a `brief` that is `campaignAudience?.brief || req.brief || req.query`,
            then the candidate pool was selected against a weaker signal than the
            one the LLM ranks against. This silently miscalibrates the entire
            feature. **Quote both call sites with file:line in the finding.**

            **(b) Snapshot fidelity to persisted state** — When the controller
            builds a "currentX" snapshot to hand to a refine / planner LLM, every
            field in the snapshot must EITHER be read from persisted state at
            snapshot time OR be an explicitly documented default. Hardcoded `0`,
            `false`, `''`, or `[]` values for fields the LLM is expected to reason
            about (e.g. `followerMin: 0`, `verifiedOnly: false`) is BLOCKER — the
            LLM is being lied to about current state and will produce a patch
            against a phantom baseline.

            **(c) Unguarded LLM-output cast** — Every `as XEnum[]`, `as Status`,
            or `LOOKUP_TABLE[llmValue]` access on a value originating from an LLM
            tool output is suspect. The Anthropic / OpenAI SDK does not enforce
            enums at runtime — Haiku and other small models occasionally violate
            them. Search for a whitelist sanitizer in a PEER file (e.g.
            `sanitizeTiers` in a sibling controller). If a peer guard exists and
            this code path skipped it, BLOCKER + cite the peer file:line as the
            canonical fix.

            **(d) Patch-empty semantics** — In refine / patch flows, controllers
            commonly write `patch.x && patch.x.length > 0 ? patch.x : undefined`.
            Trace `undefined` downstream: does it mean "no change" (correct) or
            does it fall back to a default (silently destructive)? A refine that
            doesn't touch tiers should NOT silently reset tiers to default — that
            quietly narrows the audience on every refine call. Cite the downstream
            consumer file:line where the silent default is applied.

            ## Step 6 — Coverage discipline (REQUIRED before posting)
            Look at the changed-files list from Step 0. Which files have you
            NOT opened? If any are non-trivial (controllers, services, models),
            do a 30-second skim each — you have budget. If a file is touched
            by the diff and you have not opened it, you are guessing about it.

            ## Step 7 — Self-critique (REQUIRED before synthesizing the comment)
            This is your precision floor. Run all four checks before deciding
            which findings to keep.

            **(a) Bet-money test** — For each candidate finding, ask: "Would I
            bet $100 of my own money this is a real bug?" If no, drop it.
            Especially: do NOT speculate about model id formats (e.g. "claude-opus-4-7
            might 400 because it lacks a date suffix" — this is false, undated
            aliases are valid), SDK internal behaviors, or "might do X sometimes"
            claims. If a claim did not surface as a clear finding in Steps 1–6,
            do NOT invent it now to fill the section.

            **(b) Anchor check** — Are 3 or more of your findings in the same
            file or in immediately adjacent files? If yes, you are anchoring.
            Open 2 more files from the Step 0 changed-files inventory you have
            NOT yet looked at and do a focused pass — frequently the missed
            BLOCKER lives in the file you didn't open.

            **(c) Severity recalibration** — Re-read each finding against this
            tightened ladder before committing to a severity label:
               - BLOCKER — production breaks, data loss / corruption, security
                 hole, OR silently disables a core safety mechanism the PR
                 itself advertises (e.g. a cost cap that never fires).
               - MAJOR — likely bug under realistic conditions, contract drift
                 the caller silently miscompensates for, or perf cliff at scale.
               - MINOR — non-trivial polish, observability gap, small abuse
                 vector behind a paywall.
               - Negative example (DO NOT post): "Model id might be wrong because
                 it lacks a date suffix" — 0/10 bet-money. Skip silently.

            **(d) Coverage gap final pass** — Is there any file in the Step 0
            inventory with >100 changed lines you still have not opened? Open
            it now and skim. Better to spend 2 more turns than to ship a sparse
            comment.

            Only AFTER Steps 1–7: synthesize the top 5 findings (highest
            severity / impact first) and post the comment. If you found more
            than 5 real issues, drop the lowest-severity ones — but you
            should have FOUND more than 5 to choose from on a large PR.

            Form a verdict: APPROVE / NEEDS-CHANGES / BLOCKER.
            Severity ladder (same as Step 7c, repeated for synthesis):
               - BLOCKER — broken behavior, data loss, security, will fail in prod,
                 silently disables a core safety mechanism the PR advertises.
               - MAJOR   — likely bug, missing edge case, wrong abstraction, perf
                 cliff, contract drift the caller is silently miscompensating for.
               - MINOR   — non-trivial polish (naming hides a bug, dead branch,
                 observability gap), small abuse vector behind a paywall.
               - Skip pure nits (formatting, "consider renaming foo to bar") and
                 anything that fails the bet-money test in Step 7a.

            # Output (post as a SINGLE PR comment)

            ## Verdict
            <APPROVE | NEEDS-CHANGES | BLOCKER> — one sentence why.

            ## Findings
            For each finding (max 5, ordered by severity):
            - **[BLOCKER|MAJOR|MINOR] `path/to/file.ts:42`** — what's wrong, in one line.
              Then 1–3 sentences: why it matters + suggested fix. If you traced
              through the codebase to confirm, name the file(s) you checked.

            ## What looks good
            1–3 short bullets on the strongest parts of this PR (real signal, not
            flattery). Skip if there is nothing distinctive.

            ## Özet (TR)
            Then at the very END of the same comment, add a short Turkish summary
            (this section ONLY in Turkish, everything above stays English).
            Rules for this section:
            - 2–4 cümle, toplam max 60 kelime.
            - Sade Türkçe, jargon yok (callback, race, idempotent gibi kelimeler
              kullanma; gerekirse "aynı anda iki istek gelirse" gibi açıkla).
            - Sırayla: (a) PR ne yapıyor, (b) en kritik bulgu nedir, (c) merge
              öncesi ne yapılmalı. APPROVE ise (c)'yi atla.
            - Kod yolu / değişken adları İngilizce kalsın (örn. `costGuard.ts`).
            - "Bu PR" diye başla. "Önerim:" ile bitir (eğer aksiyon varsa).

            # Hard rules
            - If the diff is trivial (docs, config bumps, dependency-only), output a
              one-line APPROVE (plus the Özet section in Turkish) and stop. Do not
              invent findings.
            - Do not restate the diff. Assume the reader already opened it.
            - Do not suggest adding tests/types as a generic note — only when a
              specific untested branch is the actual risk.
            - English output for Verdict/Findings/What looks good. Quote variable
              and function names verbatim from the code.
            - You must complete all 7 process sections (including Step 5.5 if applicable
              and Step 7 always) before synthesizing findings. Posting a sparse comment
              early is a quality regression — partial coverage is worse than thorough
              analysis, not better.
            - Precision still matters more than volume: never invent or speculate a
              finding to fill a section. Each finding must cite file:line and survive
              the Step 7a bet-money test. If a section turns up nothing, that is fine;
              do not pad.
            - For every BLOCKER you call from Step 5.5 (a/b/c/d) or from an INV-### in
              the conventions file, cite the canonical guard / sibling implementation
              (e.g. `sanitizeTiers` at `aiInfluencerDiscovery.controller.ts:78`) so the
              dev can fix it in one shot.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
